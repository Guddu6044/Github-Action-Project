name: CICD

on:
  workflow_dispatch:

jobs:
  code:
     runs-on: ubuntu-latest
     steps:
       - name: clone the code
         run : echo "Cloning the code"
  build:
     needs: [code]
     runs-on: ubuntu-latest
     steps:
       - name: Build the code using Docker
         run: echo "building the code with Docker"
  test:
     needs: [build]
     runs-on: ubuntu-latest
     steps:
      - name: Running the test cases
        run:  echo "Testing the App"

  deploy:
     needs: [build,test] 
     runs-on: ubuntu-latest
     steps:
        - name: Deploy the machine
          run: echo "Deploying the code"
