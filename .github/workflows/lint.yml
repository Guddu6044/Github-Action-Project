# What is the goal of your workflow
# Goal : Whenever someone changes the code;
# The linter will check if  the syntax ,indentation ,format is correct or not
name: Auto Linter
on: 
  push:
    paths: "*.py"

jobs:
  code:
     runs-on: ubuntu-latest
     steps:
       - name: Checkout/Clone the code
         uses: actions/checkout@v7
# Install python 
       - name: Set up Python
         uses: actions/setup-python@v7 
         with:
            python-version: '3.14'

       - name: Install Linter
         run:  pip install ruff
         
# The step will run the Linter
       - name: Check the files for Linting
         run: ruff check .

         
# This is for Gitclone in short way         
         
         
